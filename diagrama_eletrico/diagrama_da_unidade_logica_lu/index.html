<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>

(async () => {

    const token = sessionStorage.getItem("token");

    // sem token = bloqueia
    if (!token) {

        location.replace("../../index.html");
        return;

    }

    try {

        const r = await fetch("https://senhagithub.cassim-eletricista.workers.dev/", {
            method: "GET",
            headers: {
                "Authorization": token
            }
        });

        // erro servidor
        if (!r.ok) {

            sessionStorage.removeItem("token");

            location.replace("../../index.html");
            return;

        }

        const d = await r.json();

        // token inválido
        if (d.valido !== true) {

            sessionStorage.removeItem("token");

            location.replace("../../index.html");
            return;

        }

        console.log("Autenticado");

    } catch (e) {

        console.log(e);

        sessionStorage.removeItem("token");

        location.replace("../../index.html");

    }

})();

</script>
