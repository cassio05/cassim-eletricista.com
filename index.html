<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT CASSIO - Literatura Técnica</title>

    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --primary: #2563eb;
            --primary2: #3b82f6;
            --text: #f8fafc;
            --text2: #94a3b8;
            --shadow: 0 25px 50px rgba(0,0,0,.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: 
                radial-gradient(circle at top left, #1d4ed8 0%, transparent 25%),
                radial-gradient(circle at bottom right, #0f766e 0%, transparent 20%),
                linear-gradient(135deg, #020617 0%, #0f172a 45%, #111827 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 42px;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow);
        }

        .top { text-align: center; margin-bottom: 35px; }

        .logo {
            width: 74px; height: 74px; margin: auto auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: white; font-weight: bold;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
        }

        .status {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 999px;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80; font-size: .78rem; font-weight: 700;
            border: 1px solid rgba(34, 197, 94, 0.25);
            margin-bottom: 20px;
        }

        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }

        h1 { color: var(--text); font-size: 2rem; margin-bottom: 10px; }

        .subtitle { color: var(--text2); font-size: .95rem; line-height: 1.6; }

        .form-group { margin-bottom: 22px; }

        label { display: block; color: #cbd5e1; font-size: .82rem; margin-bottom: 10px; font-weight: 700; }

        .input {
            width: 100%; height: 54px; background: #0b1220;
            border: 1px solid #1e293b; border-radius: 14px;
            padding: 0 18px; color: white; font-size: 1rem; transition: .25s;
        }

        .input:focus { outline: none; border-color: #3b82f6; background: #0f172a; }

        .btn {
            width: 100%; height: 56px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: .25s; margin-top: 8px;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35); }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer {
            margin-top: 32px; padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center; color: #64748b; font-size: .78rem;
        }

        .secure { margin-top: 14px; font-size: .75rem; color: #475569; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="top">
        <div class="logo">CB</div>
        <div class="status">
            <div class="dot"></div>
            LITERATURA TÉCNICA AUTOMOTIVA ONLINE
        </div>
        <h1>CONNECT CASSIO</h1>
        <div class="subtitle">
            Plataforma de gerenciamento remoto<br>
            Redes • Diagnóstico • Infraestrutura
        </div>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="userInput">USUÁRIO</label>
            <input type="text" id="userInput" class="input" placeholder="Digite seu usuário" required>
        </div>

        <div class="form-group">
            <label for="passInput">SENHA DE ACESSO</label>
            <input type="password" id="passInput" class="input" placeholder="••••••••••" required>
        </div>

        <button class="btn" type="submit" id="btnAcessar">ACESSAR SISTEMA</button>
    </form>

    <div class="footer">
        <span style="font-weight:700; color:#94a3b8;">TERMINAL BUILD 4.8.2 • ENTERPRISE</span><br>
        Network & Fleet Management Platform<br>
        © 2026 • Secure Infrastructure System
        <div class="secure">Protected by Cloudflare Secure Gateway</div>
    </div>
</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const btn =
    document.getElementById("btnAcessar");

    const user =
    document.getElementById("userInput").value;

    const pass =
    document.getElementById("passInput").value;

    btn.innerHTML =
    "VALIDANDO CREDENCIAIS...";

    btn.disabled = true;

    try {

        const URL_WORKER =
        "https://sever.cassim-eletricista.workers.dev/";

        const response = await fetch(URL_WORKER, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                user: user,
                pass: pass
            })

        });

        if (!response.ok) {
            throw new Error("Erro no servidor");
        }

        const data = await response.json();

        if (data.success) {

            // salva token
            sessionStorage.setItem(
                "token",
                data.token
            );

            btn.innerHTML =
            "ACESSO AUTORIZADO";

            btn.style.background =
            "linear-gradient(135deg,#22c55e,#16a34a)";

            setTimeout(() => {

                window.location.href =
                "acesso_literatura.html";

            }, 1000);

        } else {

            alert("Usuário ou Senha incorretos");

            resetBtn(btn);

        }

    } catch(error) {

        console.error(error);

        alert(
        "Falha na comunicação com servidor");

        resetBtn(btn);

    }

});

function resetBtn(btn) {

    btn.innerHTML =
    "ACESSAR SISTEMA";

    btn.disabled = false;

}

</script>

</body>
</html>
