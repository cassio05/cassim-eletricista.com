 
<!DOCTYPE html>
 
<html>

<head>
    <meta charset="UTF-8">
    <script>

(async () => {

    const token = sessionStorage.getItem("token");

    // sem token = bloqueia
    if (!token) {

        location.replace("../index.html");
        return;

    }

    try {

        const r = await fetch("https://sever.cassim-eletricista.workers.dev/", {
            method: "GET",
            headers: {
                "Authorization": token
            }
        });

        // erro servidor
        if (!r.ok) {

            sessionStorage.removeItem("token");

            location.replace("../index.html");
            return;

        }

        const d = await r.json();

        // token inválido
        if (d.valido !== true) {

            sessionStorage.removeItem("token");

            location.replace("../index.html");
            return;

        }

        console.log("Autenticado");

    } catch (e) {

        console.log(e);

        sessionStorage.removeItem("token");

        location.replace("../index.html");

    }

})();

</script>
